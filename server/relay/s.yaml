# Serverless Devs deployment for the mainland-China relay (Alibaba Cloud Function Compute 3.0).
# Deploy from this folder:  RELAY_KEY="$(cat ../.relay-key)" npx @serverless-devs/s@3.1.10 deploy -y
edition: 3.0.0
name: medstats-relay
access: default

resources:
  relay:
    component: fc3
    props:
      region: cn-hongkong
      functionName: medstats-relay
      description: 医学统计学学习网站个人存档中转
      runtime: nodejs20
      handler: index.handler
      code: ./
      memorySize: 128
      cpu: 0.1
      diskSize: 512
      timeout: 20
      instanceConcurrency: 1
      internetAccess: true
      environmentVariables:
        UPSTREAM: https://medstats-sync.2210306202.workers.dev
        RELAY_KEY: ${env('RELAY_KEY')}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods: [GET, POST, PUT, DELETE, OPTIONS]
